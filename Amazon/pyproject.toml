[project]
name = "amazon-mcp"
version = "0.1.0"
description = "Local MCP server for Amazon FBA profitability tracking and inventory alerts via SP-API"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.5",
    "python-amazon-sp-api>=2.1.16",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
